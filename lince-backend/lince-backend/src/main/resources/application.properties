spring.application.name=lince-backend
server.port=8080

# Base de datos H2 persistente en archivo local
spring.datasource.url=jdbc:h2:file:./data/lincedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 y Swagger UI
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración JWT
jwt.secret=SouthboundLinceSecretKeyParaProyectoAcademico2026!
jwt.expiration=86400000