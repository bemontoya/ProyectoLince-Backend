spring.application.name=lince-backend
server.port=${PORT:8080}

# Base de datos H2 persistente en disco + consola web
spring.datasource.url=jdbc:h2:file:./data/lince_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT (Clave Base64 de 256 bits)
jwt.secret=U291dGhib3VuZExpbmNlU2VjcmV0S2V5MjAyNlByb3llY3RvTGluY2VBbmRyb2lkU3ByaW5n
jwt.expiration=86400000